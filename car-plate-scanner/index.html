<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registration Plate Scanner </title>
  <style>
    body { background: linear-gradient(to bottom,#5910B3,#A511BF); font-family: Buenos Aires, Avenir, Futura, Arial, SansSerif, sans-serif; padding: 12px; max-width: 720px; margin: auto; height:100vh}
    video, canvas { width: 100%; border-radius: 8px; background: #000; }
    .controls { display:flex; gap:8px; margin-top:8px; }
    .controls button { flex:1; padding:10px; font-size:16px; }
    ul { padding-left: 20px; }
    li { margin-bottom:6px; }
    .plate { font-weight:600; margin-right:10px; }
    .small { font-size:0.9rem; color:#51BADC; }
    .spinner {
      display:inline-block;
      width:18px;
      height:18px;
      border:3px solid rgba(0,0,0,0.15);
      border-left-color:#51BADC;
      border-radius:50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left:8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #debugText { font-size:0.9rem; color:#51BADC; margin-top:8px; white-space:pre-wrap; }
    h2 {color: #51BADC;}
    button{background-color: #51BADC;color: #5910B3;border: #A511BF;}
    h3 {color: #51BADC;}
  </style>
</head>
<body>
  <h2>Plate Scanner</h2>
  <p class="small">Point camera at the plate, press <b>Capture</b>, edit/confirm the recognised plate, then add to list. Export as .txt when done.</p>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="controls">
    <button id="captureBtn">Capture</button>
    <button id="exportBtn">Export .txt</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="ocrResult" style="margin-top:10px; display:none;">
    <label>Recognised: <input id="ocrInput" style="width:60%; font-size:16px" /></label>
    <button id="addBtn">Add to list</button>
    <span id="busySpinner" style="display:none;"><span class="spinner"></span></span>
  </div>

  <div id="debugText" style="display:none"></div>

  <h3>Plates</h3>
  <ul id="platesList"></ul>

<script>
/*
  sends a single captured frame to /.netlify/functions/ocr
  plate Recognizer returns JSON back and uses first result
  Set debug = true while testing on mobile to see API raw response
*/

const debug = false; //stop alerts
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('captureBtn');
const ocrResult = document.getElementById('ocrResult');
const ocrInput = document.getElementById('ocrInput');
const addBtn = document.getElementById('addBtn');
const platesList = document.getElementById('platesList');
const exportBtn = document.getElementById('exportBtn');
const clearBtn = document.getElementById('clearBtn');
const busySpinner = document.getElementById('busySpinner');
const debugText = document.getElementById('debugText');

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
  } catch (e) {
    alert('Camera access denied or not available: ' + e.message);
  }
}
startCamera();

function normalizePlate(s) {
  if (!s) return '';
  s = s.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.length === 7) return s.slice(0,4) + ' ' + s.slice(4);
  if (s.length === 6) return s.slice(0,3) + ' ' + s.slice(3);
  return s;
}

// Sends image to Netlify function which calls Plate Recognizer.
async function recognizePlateAPI(canvasEl) {
  if (!canvasEl.width || !canvasEl.height) throw new Error('No video frame available');
  const ctx = canvasEl.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const avg = (d[i] + d[i+1] + d[i+2]) / 3;
    
    const v = avg > 140 ? 255 : (avg < 100 ? 0 : Math.round((avg - 100) * (255/40)));
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);

  
  const dataUrl = canvasEl.toDataURL('image/jpeg', 0.7);

  // call Netlify function
  const res = await fetch('/.netlify/functions/ocr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ base64Image: dataUrl })
  });

  if (!res.ok) {
    const text = await res.text().catch(()=>`HTTP ${res.status}`);
    throw new Error(text || ('Server error ' + res.status));
  }

  const json = await res.json();
  if (debug) {
    debugText.style.display = 'block';
    debugText.textContent = JSON.stringify(json, null, 2);
    alert('Raw API response (debug):\n\n' + JSON.stringify(json, null, 2));
  }

  // Plate Recognizer returns results[] with plate text & score
  const results = json?.results || [];
  if (!results.length) return { text: '', confidence: null, raw: json };

  const best = results[0];
  const plateRaw = best?.plate ? String(best.plate).toUpperCase().replace(/[^A-Z0-9]/g,'') : '';
  const score = typeof best?.score === 'number' ? Math.round(best.score * 100) : null;
  return { text: plateRaw, confidence: score, raw: json };
}

function addPlateToList(plate) {
  if (!plate) return;
  const existing = Array.from(platesList.querySelectorAll('li')).map(li => li.dataset.plate);
  if (existing.includes(plate)) { alert('Plate already in list'); return; }
  const li = document.createElement('li');
  li.dataset.plate = plate;
  li.innerHTML = `<span class="plate">${plate}</span> <button class="del">Remove</button>`;
  platesList.appendChild(li);
  li.querySelector('.del').addEventListener('click', ()=> li.remove());
}

// Capture flow
captureBtn.addEventListener('click', async () => {
  if (video.videoWidth === 0 || video.videoHeight === 0) { alert('Camera not ready — try again'); return; }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  ocrResult.style.display = 'block';
  ocrInput.value = 'Scanning...';
  busySpinner.style.display = 'inline-block';
  debugText.style.display = 'none';
  captureBtn.disabled = true;

  try {
    const { text, confidence, raw } = await recognizePlateAPI(canvas);
    if (text && text.length >= 4) { // accept 4+ characters (looser)
      const plate = normalizePlate(text);
      ocrInput.value = plate;
      debugText.style.display = 'block';
      debugText.textContent = `Plate: ${plate}${confidence ? ' ('+confidence+'%)' : ''}`;
      // don't auto-add — let user confirm and press "Add"
    } else {
      debugText.style.display = 'block';
      debugText.textContent = `No plate detected. Raw API response logged to console.`;
      console.log('Plate API raw response:', raw);
      alert('No valid plate found. Try a clearer/closer shot with less glare.');
      ocrInput.value = '';
    }
  } catch (err) {
    console.error('OCR error', err);
    alert('OCR failed: ' + err.message);
    ocrInput.value = '';
  } finally {
    busySpinner.style.display = 'none';
    captureBtn.disabled = false;
  }
});

// Add / export / clear handlers
addBtn.addEventListener('click', () => {
  const val = ocrInput.value.trim();
  if (!val) return alert('Enter a plate before adding');
  addPlateToList(val);
  ocrInput.value = '';
  ocrResult.style.display = 'none';
});

exportBtn.addEventListener('click', () => {
  const items = Array.from(platesList.querySelectorAll('li')).map(li => li.dataset.plate);
  if (!items.length) return alert('No plates to export');
  const blob = new Blob([items.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plates.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

clearBtn.addEventListener('click', () => {
  if (confirm('Clear the list?')) platesList.innerHTML = '';
});
</script>
</body>
</html>
