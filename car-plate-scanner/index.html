<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Car Park Plate Scanner - MVP</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; max-width: 720px; margin: auto; }
    video, canvas { width: 100%; border-radius: 8px; background: #000; }
    .controls { display:flex; gap:8px; margin-top:8px; }
    .controls button { flex:1; padding:10px; font-size:16px; }
    ul { padding-left: 20px; }
    li { margin-bottom:6px; }
    .plate { font-weight:600; margin-right:10px; }
    .small { font-size:0.9rem; color:#555; }
    .spinner {
      display:inline-block;
      width:18px;
      height:18px;
      border:3px solid rgba(0,0,0,0.15);
      border-left-color: #333;
      border-radius:50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left:8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #debugText { font-size:0.9rem; color:#666; margin-top:8px; }
  </style>
</head>
<body>
  <h2>Plate Scanner — MVP</h2>
  <p class="small">Point camera at the plate, press <b>Capture</b>, confirm/edit the recognized plate, then add to list. Export as .txt when done.</p>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="controls">
    <button id="captureBtn">Capture</button>
    <button id="exportBtn">Export .txt</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="ocrResult" style="margin-top:10px; display:none;">
    <label>Recognised: <input id="ocrInput" style="width:60%; font-size:16px" /></label>
    <button id="addBtn">Add to list</button>
    <span id="busySpinner" style="display:none;"><span class="spinner"></span></span>
  </div>

  <div id="debugText" style="display:none;"></div>

  <h3>Plates</h3>
  <ul id="platesList"></ul>
  
  <script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('captureBtn');
const ocrResult = document.getElementById('ocrResult');
const ocrInput = document.getElementById('ocrInput');
const addBtn = document.getElementById('addBtn');
const platesList = document.getElementById('platesList');
const exportBtn = document.getElementById('exportBtn');
const clearBtn = document.getElementById('clearBtn');
const busySpinner = document.getElementById('busySpinner');
const debugText = document.getElementById('debugText');

// Start camera
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
  } catch (e) {
    alert('Camera access denied or not available: ' + e.message);
  }
}
startCamera();

// Normalize plate format (e.g., AB12CDE → AB12 CDE)
function normalizePlate(s) {
  if (!s) return '';
  s = s.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.length === 7) return s.slice(0,4) + ' ' + s.slice(4);
  if (s.length === 6) return s.slice(0,3) + ' ' + s.slice(3);
  return s;
}

// Call your Netlify backend function (which should call Plate Recognizer)
async function recognizePlateAPI(canvas) {
  if (!canvas.width || !canvas.height) throw new Error('No video frame available');

  // Convert the entire frame to high-contrast black & white (no cropping)
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const avg = (d[i] + d[i + 1] + d[i + 2]) / 3;
    const v = avg > 128 ? 255 : 0; // simple threshold
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx.putImageData(imgData, 0, 0);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

  // Call your secure Netlify function instead of Plate Recognizer directly
  const response = await fetch('/.netlify/functions/ocr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ base64Image: dataUrl })
  });

  if (!response.ok) {
    // try to get error text from server
    let text = 'Server error ' + response.status;
    try { text = await response.text(); } catch(e) {}
    throw new Error(text);
  }

  const json = await response.json();

  // Plate Recognizer response format: { results: [ { plate: 'ABC123', score: 0.97, ... } ] }
  const plateObj = json?.results?.[0] || null;
  const plateText = plateObj?.plate ? String(plateObj.plate).toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
  const confidence = plateObj?.score ? Math.round(plateObj.score * 100) : null;

  // return an object with text + confidence + raw for debugging
  return { text: plateText, confidence, raw: json };
}

// Shared function to add plate to the list
function addPlateToList(plate) {
  if (!plate) return;
  const existing = Array.from(platesList.querySelectorAll('li')).map(li => li.dataset.plate);
  if (existing.includes(plate)) {
    alert('Plate already in list');
    return;
  }
  const li = document.createElement('li');
  li.dataset.plate = plate;
  li.innerHTML = `<span class="plate">${plate}</span> <button class="del">Remove</button>`;
  platesList.appendChild(li);
  li.querySelector('.del').addEventListener('click', () => li.remove());
  ocrInput.value = '';
  ocrResult.style.display = 'none';
}

// Capture button flow
captureBtn.addEventListener('click', async () => {
  if (video.videoWidth === 0 || video.videoHeight === 0) {
    alert('Camera not ready yet — wait a second and try again.');
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  ocrResult.style.display = 'block';
  ocrInput.value = 'Scanning...';
  busySpinner.style.display = 'inline-block';
  debugText.style.display = 'none';
  captureBtn.disabled = true;

  try {
    const result = await recognizePlateAPI(canvas);
    // show raw debug info on mobile (quick)
    if (result.text) {
      // found a plate
      const plate = normalizePlate(result.text);
      ocrInput.value = plate;
      debugText.style.display = 'block';
      debugText.innerText = `Plate: ${plate} ${result.confidence ? '(' + result.confidence + '%)' : ''}`;
      alert('Detected plate: ' + plate + (result.confidence ? ' (' + result.confidence + '%)' : ''));
    } else {
      // no plate text
      debugText.style.display = 'block';
      debugText.innerText = 'No plate detected. Raw API response logged to console.';
      console.log('Plate API raw response:', result.raw);
      alert('No valid plate found. Try a clearer shot or move closer.');
      ocrInput.value = '';
    }
  } catch (err) {
    console.error('OCR error', err);
    alert('OCR failed: ' + (err.message || err));
    ocrInput.value = '';
  } finally {
    busySpinner.style.display = 'none';
    captureBtn.disabled = false;
  }
});

// Add button (lets user confirm / edit before adding)
addBtn.addEventListener('click', () => {
  const val = ocrInput.value.trim();
  if (!val) return alert('Enter a plate before adding');
  addPlateToList(val);
});

// Export plates
exportBtn.addEventListener('click', () => {
  const items = Array.from(platesList.querySelectorAll('li')).map(li => li.dataset.plate);
  if (items.length === 0) return alert('No plates to export');
  const blob = new Blob([items.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'plates.txt';
  a.click();
  URL.revokeObjectURL(url);
});

// Clear list
clearBtn.addEventListener('click', () => {
  if (confirm('Clear the list?')) platesList.innerHTML = '';
});
  </script>
</body>
</html>
